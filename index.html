
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قراءة الفصل - شفرة الفراغ</title>
    <style>
        /* ثيم الفراغ المظلم */
        body {
            background-color: #030303;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            color: #ffffff;
            margin: 0 0 20px 0;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 127, 0.3);
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 15px;
        }

        .chapter-card {
            background: linear-gradient(135deg, #121212, #070707);
            border: 1px solid #00ff7f;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }

        .chapter-header {
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #0f0f0f;
            border-bottom: 1px solid #1a1a1a;
            text-align: center;
        }

        .chapter-content {
            padding: 20px;
            background-color: #0a0a0a;
            font-size: 16px;
            color: #cccccc;
            line-height: 1.8;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>رواية: شفرة الفراغ</h1>

        <div class="chapter-card">
            <div class="chapter-header">
                <span class="chapter-title">الفصل الأول: اكتب هنا اسم فصل اول</span>
            </div>
            
            <div class="chapter-content">
احذف هاي و اكتب فصل اول مكانها يا اهبل
            </div>
        </div>

    </div>

</body>
</html>
